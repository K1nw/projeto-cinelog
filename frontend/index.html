<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineLog</title>
    <link rel="stylesheet" href="style.css">
</head>

<div id="modal-adicionar" class="modal">
    <div class="modal-conteudo">
        <span class="fechar-modal">&times;</span>
        <h2>Adicionar Filme</h2>

        <form id="form-adicionar">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" required placeholder="Ex: Interestelar">

            <label for="nota">Nota (1 a 10)</label>
            <input type="number" id="nota" min="1" max="10" step="0.1" required placeholder="Ex: 9.5">

            <label for="review">Review</label>
            <textarea id="review" rows="3" placeholder="Sua opinião sobre o filme..."></textarea>

            <button type="submit">Salvar Filme</button>
        </form>
    </div>
</div>
<body>

    <header>
        <h1>CineLog</h1>
        <div class="barra-filtros">
            <input type="text" placeholder="Buscar filme pelo título...">
            <button type="button">+ Adicionar</button>
        </div>
    </header>

    <main class="container-vitrine">
        <div class="card-filme" data-nota="9.5">
            <h3>Interestelar</h3>
            <span class="nota">⭐ 9.5/10</span>
            <p class="review">"Uma obra-prima da ficção científica."</p>
        </div>

        <div class="card-filme" data-nota="8.5">
            <h3>Clube da Luta</h3>
            <span class="nota">⭐ 8.5/10</span>
            <p class="review">"Filme estranho, intenso e muito marcante."</p>
        </div>

        <div class="card-filme" data-nota="10.0">
            <h3>O Poderoso Chefão</h3>
            <span class="nota">⭐ 10.0/10</span>
            <p class="review">"Um clássico absoluto."</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
