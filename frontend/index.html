<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineLog</title>
    <link rel="stylesheet" href="style.css">
</head>

<div id="modal-adicionar" class="modal">
    <div class="modal-conteudo">
        <span class="fechar-modal">&times;</span>
        <h2>Adicionar Filme</h2>

        <form id="form-adicionar">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" required placeholder="Ex: Interestelar">

            <label for="nota">Nota (1 a 10)</label>
            <input type="number" id="nota" min="1" max="10" step="0.1" required placeholder="Ex: 9.5">

            <label for="review">Review</label>
            <textarea id="review" rows="3" placeholder="Sua opinião sobre o filme..."></textarea>

            <button type="submit">Salvar Filme</button>
        </form>
    </div>
</div>
<body>

 <header class="header-principal">

    <div class="logo-area">
        <div class="logo-cine">
            <span>▶</span>
        </div>

        <div class="logo-texto">
            <h1>CineLog</h1>
            <p>Sua coleção de filmes</p>
        </div>
    </div>

    <div class="barra-filtros">
        <div class="campo-busca">
            <span>⌕</span>
            <input type="text" placeholder="Buscar filme pelo título...">
        </div>

        <button type="button">+ Adicionar</button>
    </div>

</header>

    <main class="container-vitrine">
    </main>

    <script src="script.js"></script>
</body>
</html>
